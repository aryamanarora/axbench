# Activation Oracle Activation Steering on Llama-3.1-8B-Instruct.
#
# Directly optimizes activations per-instance via gradient descent on the
# oracle loss at inference time. Stronger than gradient steering vectors
# but not reusable across examples (per-instance optimization).
#
# Prerequisites:
#   1. Clone activation_oracles into axbench/models/_activation_oracles
#   2. Oracle LoRA auto-downloaded from HF
#   3. Requires 1 GPU (oracle shares the target model)
#
# Usage:
#   # No training needed — all work happens at inference time.
#
#   # Inference (activation steering):
#   torchrun --nproc_per_node=1 axbench/scripts/inference.py \
#     --config axbench/sweep/aryaman/activation_oracle/activation_steering_llama3_8b.yaml --mode steering

generate:
  lm_model: "gpt-4o-mini"
  output_length: 128
  num_of_examples: 144
  concept_path: "axbench/data/gemma-2-2b_20-gemmascope-res-16k.json"
  max_concepts: 500
  master_data_dir: "axbench/data"
  dataset_category: "instruction"
  lm_use_cache: false
  seed: 42

train:
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  layer: 16  # 50% of 32 layers = extraction_layer
  component: "res"
  seed: 42
  use_bf16: true
  output_length: 128
  models:
    ActivationOracleActivationSteering:
      batch_size: 1
      n_epochs: 1
      lr: 0.01
      low_rank_dimension: 1
      intervention_positions: "all"
      intervention_type: "addition"
      binarize_dataset: false
      train_on_negative: true
      exclude_bos: true

inference:
  use_bf16: true
  models: ["ActivationOracleActivationSteering"]
  model_name: "meta-llama/Llama-3.1-8B-Instruct"
  # latent related params
  output_length: 128
  latent_num_of_examples: 36
  latent_batch_size: 4
  # steering related params
  steering_intervention_type: "addition"
  steering_model_name: "meta-llama/Llama-3.1-8B-Instruct"
  steering_datasets: ["AlpacaEval"]
  steering_batch_size: 1
  steering_output_length: 128
  steering_layers: [16]
  steering_num_of_examples: 10
  steering_factors: [0.5, 1.0, 2.0, 3.0, 5.0]
  # master data dir
  master_data_dir: "axbench/data"
  seed: 42
  lm_model: "gpt-4o-mini"
  temperature: 1.0

evaluate:
  models: ["ActivationOracleActivationSteering"]
  latent_evaluators: [
    "AUCROCEvaluator",
    "HardNegativeEvaluator",
  ]
  steering_evaluators: [
    "LMJudgeEvaluator",
  ]
  winrate_split_ratio: 0.5
  num_of_workers: 32
  lm_model: "gpt-4o-mini"
  run_winrate: false
  winrate_baseline: "PromptSteering"
  master_data_dir: "axbench/data"
